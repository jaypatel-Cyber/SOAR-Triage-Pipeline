# TheHive 5 — application.conf
# Mounted at: /etc/thehive/application.conf

# ── Database: Cassandra ───────────────────────────────────────────────────────
db.janusgraph {
  storage {
    backend: cql
    hostname: ["cassandra"]
    cql {
      cluster-name: thehive
      keyspace: thehive
    }
  }
  index.search {
    backend: elasticsearch
    hostname: ["elasticsearch"]
    index-name: thehive
  }
}

# ── Attachment Storage ────────────────────────────────────────────────────────
storage {
  provider: localfs
  localfs.location: /opt/thp/thehive/data
}

# ── Application ───────────────────────────────────────────────────────────────
play.http.secret.key: "SOARLabSecretKeyChangeInProd1234567890"

# ── Authentication ────────────────────────────────────────────────────────────
auth {
  providers: [
    {name: session}
    {name: basic, realm: thehive}
    {name: local}
  ]
  defaultUserDomain: "thehive.local"
}

# ── Default organisation ──────────────────────────────────────────────────────
organisation.defaults {
  name: "SOC"
  description: "Security Operations Center — SOAR Lab"
}

# ── TheHive API ───────────────────────────────────────────────────────────────
play.http.parser.maxMemoryBuffer: 256m

