<!--
  ossec.conf — Wazuh Manager Configuration
  Relevant sections: integrations + decoder options
  Full config is managed by the Docker image; this file overlays key sections.
-->
<ossec_config>

  <!-- ── Global Settings ─────────────────────────────────────────────── -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wpp</smtp_server>
    <email_from>wazuh@example.com</email_from>
    <email_to>soc@example.com</email_to>
    <email_maxperhour>12</email_maxperhour>
  </global>

  <!-- ── Log Analysis Sources ────────────────────────────────────────── -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- ── Alerts Configuration ────────────────────────────────────────── -->
  <alerts>
    <log_alert_level>3</log_alert_level>  <!-- Log alerts level 3+ -->
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ── Rules ───────────────────────────────────────────────────────── -->
  <ruleset>
    <!-- Built-in Wazuh rules -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <!-- Custom rules (mounted from ./wazuh/custom-rules/) -->
    <rule_include>rules/local_rules.xml</rule_include>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
  </ruleset>

  <!-- ═══════════════════════════════════════════════════════════════════
       SOAR INTEGRATION — n8n Webhook
       Fires on all rules tagged with "soar_trigger" group
       Minimum alert level: 10
  ════════════════════════════════════════════════════════════════════ -->
  <integration>
    <name>custom-n8n</name>
    <hook_url>http://n8n:5678/webhook/wazuh-triage</hook_url>
    <rule_id>100100,100101,100102,100103,100104,100105,100106,100107</rule_id>
    <alert_format>json</alert_format>
    <!-- api_key is passed as argv[2] — not used by our script -->
    <api_key>NOT_REQUIRED</api_key>
  </integration>

  <!-- ── Active Response (optional: auto-block on P1 alerts) ─────────── -->
  <!--
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100101,100103</rules_id>
    <timeout>3600</timeout>
  </active-response>
  -->

  <!-- ── Vulnerability Detection ─────────────────────────────────────── -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

</ossec_config>
